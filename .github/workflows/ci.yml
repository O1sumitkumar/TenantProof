name: ci
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tenantproof
          POSTGRES_USER: tenantproof
          POSTGRES_PASSWORD: tenantproof
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tenantproof -d tenantproof"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://tenantproof:tenantproof@localhost:5432/tenantproof
      LLM_MODE: fixture
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest -q
