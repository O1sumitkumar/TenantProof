# A `worker` service (arq) is added in M3 with the agent.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tenantproof
      POSTGRES_USER: tenantproof
      POSTGRES_PASSWORD: tenantproof
    ports: ["5433:5432"]  # 5433 on the host: 5432 is often taken by a local Postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantproof -d tenantproof"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+psycopg://tenantproof:tenantproof@postgres:5432/tenantproof
      REDIS_URL: redis://redis:6379/0
      PUBLIC_BASE_URL: http://localhost:8000
      DEV_STUB_AUTH: "true"  # M0 only; real login lands in M1
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
    command: >
      sh -c "uv run --no-dev alembic upgrade head &&
             uv run --no-dev python -m app.seed &&
             uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
