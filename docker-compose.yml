# WS2: nginx publishes the only host port, so the API can run as several replicas:
#   docker compose up --scale api=2
# The `migrate` service runs Alembic (and seeds) once, not once per replica.
# A `worker` service (arq) is added in M3 with the agent.
x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://tenantproof:tenantproof@postgres:5432/tenantproof
  REDIS_URL: redis://redis:6379/0
  PUBLIC_BASE_URL: http://localhost:8000
  # Plain http on localhost: browsers drop Secure cookies there. Keep true everywhere else.
  COOKIE_SECURE: "false"
  # Runs without an API key by default: `fixture` replays recorded model replies (none are
  # recorded yet, so a run ends failed, but nothing errors at start-up). For a real run:
  #   LLM_MODE=live ANTHROPIC_API_KEY=... make up
  LLM_MODE: ${LLM_MODE:-fixture}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
  STORAGE_DIR: /data/storage
  # Only the proxy (fixed address below) may set X-Forwarded-For; uvicorn trusts that peer.
  FORWARDED_ALLOW_IPS: 172.28.0.10

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tenantproof
      POSTGRES_USER: tenantproof
      POSTGRES_PASSWORD: tenantproof
    # Host port is configurable: 5432 is often taken by a local Postgres.
    ports: ["${POSTGRES_HOST_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantproof -d tenantproof"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [backend]

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Schema first, then the demo seed. Both are idempotent.
    command: >
      sh -c "uv run --no-dev alembic upgrade head &&
             uv run --no-dev python -m app.seed"
    environment:
      <<: *app-env
      SEED_PASSWORD: ${SEED_PASSWORD:-tenantproof-demo}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: *app-env
    volumes: [blobs:/data]
    # --proxy-headers: take the client address from the proxy's X-Forwarded-For, so rate
    # limits key on the real client instead of the proxy's socket address.
    command: >
      sh -c "uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8000
             --proxy-headers"
    healthcheck:
      # /healthz checks Postgres and Redis, so this waits for real readiness.
      test:
        ["CMD", "/app/backend/.venv/bin/python", "-c",
         "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [backend]

  proxy:
    image: nginx:1.29-alpine
    ports: ["${API_HOST_PORT:-8000}:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      api: { condition: service_healthy }
    networks:
      backend:
        # Fixed address so every API replica can trust exactly this peer for X-Forwarded-For.
        ipv4_address: 172.28.0.10

networks:
  backend:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
  blobs:
