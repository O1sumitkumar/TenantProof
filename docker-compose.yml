# A `worker` service (arq) is added in M3 with the agent.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tenantproof
      POSTGRES_USER: tenantproof
      POSTGRES_PASSWORD: tenantproof
    # Host port is configurable: 5432 is often taken by a local Postgres.
    ports: ["${POSTGRES_HOST_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantproof -d tenantproof"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+psycopg://tenantproof:tenantproof@postgres:5432/tenantproof
      REDIS_URL: redis://redis:6379/0
      PUBLIC_BASE_URL: http://localhost:8000
      # Plain http on localhost: browsers drop Secure cookies there. Keep true everywhere else.
      COOKIE_SECURE: "false"
      # Runs without an API key by default: `fixture` replays recorded model replies (none are
      # recorded yet, so a run ends failed, but nothing errors at start-up). For a real run:
      #   LLM_MODE=live ANTHROPIC_API_KEY=... make up
      LLM_MODE: ${LLM_MODE:-fixture}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      RUN_BUDGET_S: ${RUN_BUDGET_S:-180}  # #49: seconds one analysis run may take
      SEED_PASSWORD: ${SEED_PASSWORD:-tenantproof-demo}
      STORAGE_DIR: /data/storage
    volumes: [blobs:/data]
    command: >
      sh -c "uv run --no-dev alembic upgrade head &&
             uv run --no-dev python -m app.seed &&
             uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
  blobs:
