# Railway config for the api service (WS2). The proxy is nginx locally; on Railway the
# platform edge terminates TLS, so the api itself must trust the forwarded client address.
[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
startCommand = "uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers"
