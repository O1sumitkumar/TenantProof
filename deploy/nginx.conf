# WS2: one host port, replicated API behind it (`docker compose up --scale api=2`).
# The API trusts only this proxy: X-Forwarded-For is overwritten with the real peer address,
# so a client-supplied header cannot pick its rate-limit key.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Docker's embedded DNS re-resolves `api` as replicas start and stop (`resolve` below).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Issue #10: the two upload routes can carry 20 x 25 MiB + 1 MiB each, and FastAPI reads
    # a multipart body before its dependencies run. Cap concurrent and repeated uploads per
    # client here, and stream their bodies instead of buffering them to this proxy's disk.
    # Everything else is small JSON or the UI and stays at 30 MiB.
    limit_conn_zone $binary_remote_addr zone=upload_conn:10m;
    limit_req_zone $binary_remote_addr zone=upload_req:10m rate=1r/s;

    # One 25 MiB evidence file plus multipart overhead (MAX_UPLOAD_BYTES in config.py).
    client_max_body_size 30m;

    # WS2: gzip for the text payloads, not for images or the evidence zip.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    upstream api {
        zone api 64k;
        server api:8000 resolve;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # nginx's default is 503; 429 says what happened and matches the app's rate limit.
        limit_conn_status 429;
        limit_req_status 429;

        # Uploads: at most 2 in flight per client and 1 new one per second (burst 4). The app
        # still enforces its own size/type/count rules; this only bounds the spooling.
        location ~ ^/api/(intake/[^/]+/files|cases/[^/]+/evidence)$ {
            limit_conn upload_conn 2;
            limit_req zone=upload_req burst=4 nodelay;
            client_max_body_size 510m;
            # Issue #10: hand the body to the API as it arrives. The intake token is checked
            # before the body is parsed, so a bad link costs no disk here or on a replica.
            proxy_request_buffering off;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Overwrite, never append: FORWARDED_ALLOW_IPS trusts this proxy only.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Overwrite, never append: FORWARDED_ALLOW_IPS trusts this proxy only.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # A package build streams a zip; allow a slow build without hanging forever.
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
