# WS2: one host port, replicated API behind it (`docker compose up --scale api=2`).
# The API trusts only this proxy: X-Forwarded-For is overwritten with the real peer address,
# so a client-supplied header cannot pick its rate-limit key.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Docker's embedded DNS re-resolves `api` as replicas start and stop (`resolve` below).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # One 25 MiB evidence file plus multipart overhead (MAX_UPLOAD_BYTES in config.py).
    client_max_body_size 30m;

    # WS2: gzip for the text payloads, not for images or the evidence zip.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    upstream api {
        zone api 64k;
        server api:8000 resolve;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Overwrite, never append: FORWARDED_ALLOW_IPS trusts this proxy only.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # A package build streams a zip; allow a slow build without hanging forever.
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
